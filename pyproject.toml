[project]
name = "upbank-api-finance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ChengMingLiew", email = "125233730+ChengMingLiew@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "simplejson>=4.3.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
upbank-api-finance = "apps:main"

[tool.uv.build-backend]
module-name = "apps"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
